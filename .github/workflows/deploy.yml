name: Deploy to GitHub Pages

# Template note:
#   This workflow is set to manual-only (workflow_dispatch) to avoid failed runs
#   on the template repo where GitHub Pages is not enabled.
#   To enable auto-deploy after forking:
#     1. Enable Pages in repo Settings -> Pages -> Source: GitHub Actions
#     2. Uncomment the `push:` block below so every push to main triggers a deploy
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
